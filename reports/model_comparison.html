<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    #vis.vega-embed {
      width: 100%;
      display: flex;
    }

    #vis.vega-embed details,
    #vis.vega-embed details summary {
      position: relative;
    }
  </style>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/vega@6"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/vega-lite@6.4.1"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/vega-embed@7"></script>
</head>
<body>
  <div id="vis"></div>
  <script>
    (function(vegaEmbed) {
      var spec = {"config": {"view": {"continuousWidth": 300, "continuousHeight": 300}}, "data": {"values": [{"model": "B0", "name": "Training base rates", "log_loss": 1.071882476915757, "brier_score": 0.6494317404410858, "accuracy": 0.4405048076923077}, {"model": "B1", "name": "Elo logistic baseline", "log_loss": 0.9465780693882199, "brier_score": 0.5551350085139684, "accuracy": 0.5819310897435898}, {"model": "M1", "name": "All-feature logistic", "log_loss": 0.9441292435935621, "brier_score": 0.5526677560302286, "accuracy": 0.5813301282051282}, {"model": "M2", "name": "Histogram gradient boosting", "log_loss": 0.9807707865214571, "brier_score": 0.5743186196339755, "accuracy": 0.5510817307692307}]}, "mark": {"type": "bar"}, "encoding": {"color": {"field": "model", "legend": null, "scale": {"domain": ["B0", "B1", "M1", "M2"], "range": ["#64748b", "#2563eb", "#059669", "#d97706"]}, "type": "nominal"}, "tooltip": [{"field": "model", "type": "nominal"}, {"field": "log_loss", "format": ".4f", "type": "quantitative"}], "x": {"field": "log_loss", "scale": {"zero": true}, "title": "Mean tournament log loss (lower is better)", "type": "quantitative"}, "y": {"field": "name", "sort": "x", "title": null, "type": "nominal"}}, "height": 170, "title": "Comparison against the baselines", "$schema": "https://vega.github.io/schema/vega-lite/v6.4.1.json"};
      var embedOpt = {"mode": "vega-lite"};

      function showError(el, error){
          el.innerHTML = ('<div style="color:red;">'
                          + '<p>JavaScript Error: ' + error.message + '</p>'
                          + "<p>This usually means there's a typo in your chart specification. "
                          + "See the javascript console for the full traceback.</p>"
                          + '</div>');
          throw error;
      }
      const el = document.getElementById('vis');
      vegaEmbed("#vis", spec, embedOpt)
        .catch(error => showError(el, error));
    })(vegaEmbed);

  </script>
</body>
</html>
